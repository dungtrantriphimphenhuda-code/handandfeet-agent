name: 🤖 Run OpenManus with Gemma 4 (Local, No API Key)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt cho agent'
        required: true
        default: 'Tìm kiếm thông tin về Gemma 4 và tóm tắt lại'
      model:
        description: 'Model Gemma 4 variant (ollama tag)'
        required: true
        default: 'gemma4:e2b'
        type: choice
        options:
          - 'gemma4:e2b'
          - 'gemma4:e4b'
      max_tokens:
        description: 'Max tokens'
        required: false
        default: '2048'

env:
  OLLAMA_HOST: 127.0.0.1:11434
  PYTHONUNBUFFERED: "1"
  OLLAMA_NUM_THREADS: "4"

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 💾 Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ github.event.inputs.model }}-${{ runner.os }}
          restore-keys: |
            ollama-models-${{ github.event.inputs.model }}-

      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🔧 Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: 🚀 Start Ollama server (background)
        run: |
          sudo systemctl stop ollama 2>/dev/null || true
          ollama serve &
          echo "OLLAMA_PID=$!" >> $GITHUB_ENV
          sleep 5
          curl -s http://localhost:11434/api/tags | head -c 200 || true

      - name: ⬇️ Pull Gemma 4 model
        run: |
          echo "Pulling ${{ github.event.inputs.model }}..."
          ollama pull ${{ github.event.inputs.model }}
          echo "Model pulled successfully"
          ollama list
          du -sh ~/.ollama/models/ 2>/dev/null || true

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium || true

      - name: ⚙️ Create config.toml (Ollama local + headless browser)
        run: |
          mkdir -p config
          cat > config/config.toml << EOF
          # Global LLM configuration — Local Ollama (no API key required)
          [llm]
          api_type = "ollama"
          model = "${{ github.event.inputs.model }}"
          base_url = "http://localhost:11434/v1"
          api_key = "ollama"
          max_tokens = ${{ github.event.inputs.max_tokens }}
          temperature = 0.0

          # Vision model
          [llm.vision]
          api_type = "ollama"
          model = "${{ github.event.inputs.model }}"
          base_url = "http://localhost:11434/v1"
          api_key = "ollama"
          max_tokens = ${{ github.event.inputs.max_tokens }}
          temperature = 0.0

          # Browser MUST run headless on GitHub Actions
          [browser]
          headless = true
          disable_security = true

          # MCP configuration
          [mcp]
          server_reference = "app.mcp.server"

          # Runflow
          [runflow]
          use_data_analysis_agent = false
          EOF
          echo "Config created:"
          cat config/config.toml

      - name: 🧠 Run OpenManus Agent
        run: |
          echo "Running with prompt: ${{ github.event.inputs.prompt }}"
          python main.py --prompt "${{ github.event.inputs.prompt }}"

      - name: 📤 Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmanus-outputs-${{ github.run_id }}
          path: |
            logs/
            output/
            *.log
          if-no-files-found: ignore

      - name: 🧹 Cleanup
        if: always()
        run: |
          kill $OLLAMA_PID 2>/dev/null || true
          echo "Cleanup done"
